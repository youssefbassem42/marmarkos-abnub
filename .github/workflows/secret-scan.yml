name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    env:
      # The version is pinned and the download is checked against the
      # checksum of the release - a moving tag would be a supply-chain
      # hole in the gate that is supposed to protect the supply chain.
      GITLEAKS_VERSION: v8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans the history, not only the current tree.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_8.28.0_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan the history
        # CI-004: a committed secret fails the build. The fake secrets of
        # the test suite are allowed by .gitleaks.toml (and only them).
        run: gitleaks detect --source . --redact --no-banner --log-opts="--all" --exit-code 1
