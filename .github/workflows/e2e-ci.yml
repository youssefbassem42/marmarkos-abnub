name: End-to-end tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      # The browser, the API and the database of the run. The values are
      # throw-away test secrets (32+ bytes, as RFC 7518 asks for HS256).
      APP_ENV: test
      DEBUG: "true"
      E2E_API_PORT: "18010"
      E2E_WEB_PORT: "4173"
      E2E_DATABASE_URL: postgresql+asyncpg://marmarkos:marmarkos@localhost:55432/marmarkos_e2e
      JWT_SECRET: e2e-jwt-secret-0123456789-0123456789-0123456789
      JWT_REFRESH_SECRET: e2e-jwt-refresh-secret-0123456789-0123456789-012
      MAIL_PROVIDER: console
      ATTENDANCE_PIN_PEPPER: e2e-pepper-0123456789-0123456789-0123456789

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marmarkos
          POSTGRES_PASSWORD: marmarkos
          POSTGRES_DB: marmarkos_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U marmarkos -d marmarkos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          cd frontend && npm ci && cd ..

      - name: Install the browser
        # The end-to-end tests drive a real Chromium (QA-001): a member
        # signs in, takes a quiz and a servant records a check-in.
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run the end-to-end tests
        # The run creates its own database (marmarkos_e2e), applies the
        # migrations and seeds the data it needs - it never touches the
        # database of the other jobs.
        working-directory: frontend
        run: npx playwright test --reporter=list

      - name: The artefacts of the run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
