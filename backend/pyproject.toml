[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marmarkos-abnub-backend"
version = "0.1.0"
description = "Marmarkos ABNUB Platform API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",

    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # PyJWT replaces python-jose (PYSEC-2026-4298): the app only signs and
    # verifies HS256 tokens, so the swap keeps every existing token valid.
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",

    "httpx>=0.28",
    # Transitive of httpx; floor raised past PYSEC-2026-4320.
    "certifi>=2026.10.19",
    "segno>=1.6",

    "email-validator>=2.2",

    # python:3.x-slim ships no OS zoneinfo database; without this wheel
    # ZoneInfo("Africa/Cairo") raises and every attendance route 500s.
    "tzdata>=2024.1"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
    # CI-003: the dependency scanner is part of the pipeline, not a
    # manual step. It audits the resolved environment against the
    # PyPI advisory database.
    "pip-audit>=2.7"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revisions are generated from its own template (typing.Union style,
# long Column lines); linting/formatting them breaks on every new migration.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# The floor is the current measured coverage (77.12 % with branch
# coverage at the time of writing). It may only ever be raised - never
# lowered (CI-005).
fail_under = 77
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
