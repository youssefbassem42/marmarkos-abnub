[project]
name = "marmarkos-abnub-backend"
version = "0.1.0"
description = "Marmarkos ABNUB Platform API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",

    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",

    "httpx>=0.28",
    "segno>=1.6",

    "email-validator>=2.2"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-python-jose>=1.3",
    "httpx>=0.28"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
