# The contract test of the API (QA-005).
#
# The schema is the contract of the API: every answer it does not
# mention is a surprise for the client. The checks below compare the
# answers of the running API with the schema.
#
# Two groups of operations are not part of the contract:
#
# - /api/v1/internal/* are the operational endpoints. They answer 503
#   while the scheduler is disabled - that is their documented
#   behaviour, not a defect, and a 5xx is a failure of the check.
# - the data-rejection checks (positive_data_acceptance /
#   negative_data_rejection) are not enabled: Pydantic accepts a Unix
#   timestamp as a date and email-validator rejects the reserved .test
#   domain, so the fuzzer reports two known differences instead of
#   defects. They are run by hand and the findings are written down in
#   docs/AUDIT_REMEDIATION_FEEDBACK.md.

[checks]
# Only the checks that are listed below run.
enabled = false
not_a_server_error = { enabled = true }
status_code_conformance = { enabled = true }
content_type_conformance = { enabled = true }
response_headers_conformance = { enabled = true }
response_schema_conformance = { enabled = true }
missing_required_header = { enabled = true }
allow_header_conformance = { enabled = true }

# Three examples per operation are enough to catch a drift and keep the
# run under a minute.
[generation]
max-examples = 3

[[operations]]
# The operational endpoints are switched off for the contract test.
include-path-regex = ".*/internal/.*"
enabled = false
