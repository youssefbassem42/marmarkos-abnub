# The security headers of the API (SEC-009) for the HTML and the static
# files. The Content-Security-Policy of the *document* is not set here on
# purpose: the app ships inline styles and the policy needs its own review
# - the API already sends a strict one.
#
# nginx does not inherit add_header from the server level when a location
# declares its own, so this snippet is included in every location that
# sets a header of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
