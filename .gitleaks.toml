title = "Marmarkos ABNUB — gitleaks configuration"

# The default rules are used unchanged; only the exception below is
# added.
#
# The exception matches the **value** of the secret, never a path: an
# allowlist of a path would hide **every** secret committed under it
# (gitleaks combines the conditions of an allowlist with "or"), and the
# tests are exactly where a real secret is most likely to be pasted by
# mistake. The fake secrets of the test suite, of the pipeline and of
# the end-to-end run are recognisable by their prefix, and they never
# reach a provider.
[extend]
useDefault = true

[[allowlists]]
description = "The fake secrets of the test suite, of the pipeline and of the end-to-end run."
regexTarget = "secret"
regexes = [
  '''^test-jwt-(secret|refresh-secret)-[0-9-]+$''',
  '''^(ci|e2e)-(jwt|test)-(secret|refresh-secret)-[0-9-]+$''',
  '''^e2e-pepper-[0-9-]+$''',
]
